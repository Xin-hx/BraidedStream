<!-- index page -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BraidedStream - Demo</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/demo/style.css" />
  </head>
  <body>
    <div class="layout">
      <aside id="panel" class="panel">
        <button id="btn-panel" class="panel-toggle" title="toggle panel">
          «
        </button>
        <div class="panel-body">
          <div class="brand" aria-label="BraidedStream">
            <span class="brand-name">BraidedStream</span>
          </div>
          <div class="p-title">Controls</div>

          <label
            >Dataset
            <select id="ctl-dataset">
              <option value="illustration" selected>Illustration ensembles</option>
              <option value="tcm">TCM prescriptions</option>
              <option value="covid-inc">COVID-inc</option>
            </select>
          </label>
          <label
            >Vis method
            <select id="ctl-vis-method">
              <option value="braided" selected>Braided stream</option>
              <option value="star">markers</option>
              <option value="color-blur">Color + blur</option>
            </select>
          </label>
          <label
            >Baseline
            <select id="ctl-baseline">
              <option value="wiggle" selected>L2 wiggle</option>
              <option value="sine">Sine (Gaussian L2)</option>
            </select>
          </label>
          <label
            >KDE bandwidth control
            <input
              id="ctl-bandwidth-ratio"
              type="range"
              min="0.1"
              max="1.5"
              step="0.05"
              value="0.3"
            />
          </label>
          <label class="chk">
            <input id="ctl-smooth" type="checkbox" checked /> Smooth contours
          </label>
          <label class="chk">
            <input id="ctl-envelope-stroke" type="checkbox" /> Show envelope stroke
          </label>
          <label class="chk">
            <input id="ctl-representative-stroke" type="checkbox" /> Show representative layer stroke
          </label>
          <label class="chk">
            <input id="ctl-time-cell" type="checkbox" /> Show time cell
          </label>
          <label class="chk">
            <input id="ctl-branch-stroke" type="checkbox" /> Show branch stroke
          </label>
          <label class="chk">
            <input id="ctl-y-axis" type="checkbox" checked /> Show y-axis
          </label>
          <label class="chk">
            <input id="ctl-density-gradient" type="checkbox" /> Density color gradient
          </label>
          <label class="chk">
            <input id="ctl-legend" type="checkbox" checked /> Show legend
          </label>
          <div class="actions">
            <button id="btn-collapse" title="toggle braid">Collapse</button>
            <button id="btn-svg">SVG</button>
          </div>
        </div>
      </aside>

      <main class="content">
        <svg id="chart" role="img" aria-label="braided streamgraph"></svg>
        <svg
          id="time-filter"
          role="slider"
          aria-label="Time range filter"
        ></svg>
        <div id="tooltip" class="tooltip hidden"></div>
        <div id="costs" class="costs"></div>
      </main>
      <aside id="legend" class="legend" aria-label="Layer legend">
        <button id="btn-legend-restore" class="legend-restore" type="button" aria-label="Restore legend" title="Expand legend" hidden>
          «
        </button>
        <div class="legend-header">
          <strong>Legend</strong>
          <button id="btn-legend-minimize" type="button" aria-label="Minimize legend">−</button>
          <button id="btn-legend-hide" type="button" aria-label="Hide legend">×</button>
        </div>
        <div class="legend-tools">
          <label>
            Order
            <select id="ctl-legend-sort">
              <option value="tpid">TPID</option>
              <option value="category">Category (A–Z)</option>
            </select>
          </label>
          <label>
            Palette
            <select id="ctl-legend-palette">
              <option value="reference">BraidedStream</option>
              <option value="tableau10">Tableau 10</option>
              <option value="set2">ColorBrewer Set 2</option>
              <option value="paired">ColorBrewer Paired</option>
            </select>
          </label>
        </div>
        <div id="legend-note" class="legend-note"></div>
        <div id="legend-items" class="legend-grid"></div>
        <div id="legend-status" class="legend-status" aria-live="polite"></div>
      </aside>
    </div>

    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>
